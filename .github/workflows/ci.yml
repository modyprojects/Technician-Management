name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token; no secrets are used by this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (Gitleaks 8.30.1, full history, values redacted)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: CI script tests (Vercel ignore rule)
        run: npm run test:ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Browser bundle check (secrets; fixtures after go-live)
        run: npm run scan:bundle

      - name: Install Chromium for Playwright
        timeout-minutes: 4
        run: npx playwright install --with-deps --only-shell chromium

      - name: End-to-end tests (390 / 820 / 1440)
        run: npm run test:e2e

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
