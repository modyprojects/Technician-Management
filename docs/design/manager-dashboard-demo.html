div></div></section>${trends()}`}
function dateText(){let d=new Date(2026,10,5);let n=state.techOffset;switch(state.techPeriod){case'day':d.setDate(d.getDate()+n);return d.toLocaleDateString('he-IL');case'week':d.setDate(d.getDate()-d.getDay()+n*7);let e=new Date(d);e.setDate(e.getDate()+6);return d.toLocaleDateString('he-IL')+' – '+e.toLocaleDateString('he-IL');case'month':d=new Date(2026,10+n,1);return d.toLocaleDateString('he-IL',{month:'long',year:'numeric'});case'year':return ''+(2026+n);case'custom':return state.from+' עד '+state.to;}}
function tech(){const t=techs.find(t=>t.id===state.tech);return `<div class="controls"><div class="controlGroup"><b class="label">טכנאי:</b>${techs.map(x=>`<button class="pill ${x.id===state.tech?'on':''}" onclick="selectTech('${x.id}')">${x.name}</button>`).join('')}</div><div class="controlGroup"><b class="label">תקופה:</b>${[['day','יום'],['week','שבוע'],['month','חודש'],['year','שנה'],['custom','מותאם']].map(([id,name])=>`<button class="pill ${state.techPeriod===id?'on':''}" onclick="selectPeriod('${id}')">${name}</button>`).join('')}</div><div class="periodNav ${state.techPeriod==='custom'?'hidden':''}"><button class="navBtn" onclick="movePeriod(-1)">›</button><span class="miniStat" id="techPeriodText">${dateText()}</span><button class="navBtn" ${state.techOffset===0?'disabled':''} onclick="movePeriod(1)">‹</button></div><div class="customRange ${state.techPeriod==='custom'?'show':''}"><label class="label">מתאריך <input type="date" value="${state.from}" onchange="setCustom('from',this.value)"></label><label class="label">עד תאריך <input type="date" value="${state.to}" onchange="setCustom('to',this.value)"></label></div></div><section class="section"><div class="sectionHead"><h2>פעילות — ${t.name}</h2><span class="label">${dateText()}</span></div><div class="kpis">${kpi('ביקורים שבוצעו',t.visits,'','techvisits')}${kpi('קריאות שנסגרו',t.closed,'','techclosed')}${kpi('ביקורים מתוכננים',t.planned,'','techplanned')}${kpi('דרשו המשך טיפול',t.follow,'','techfollow')}</div></section><section class="section"><div class="sectionHead"><h2>מדדי ביצועים — ${t.name}</h2><span class="label">ללא השוואה בין טכנאים</span></div><div class="kpis">${kpi('זמן טיפול ממוצע',t.treat,'דק׳','techtreat')}${kpi('זמן נסיעה ממוצע',t.drive,'דק׳','techdrive')}${kpi('פתרון בביקור ראשון',t.first,'%','techfirst')}${kpi('זמן סגירת קריאה',t.closeH,'שעות','techclose')}${kpi('עמידה בתכנון',t.plan,'%','techplan')}</div></section><section class="section card"><div class="flexBetween"><h2>דוחות הביקורים של ${t.name}</h2><button class="link" onclick="openDetail('techreports')">הצג דוחות ‹</button></div><p class="hint">גישה מהירה לדוחות טיפול, סיכומים ותמונות. בשלב הזה אין גרפים או השוואות אישיות.</p></section><p class="hint">מסנני הטכנאי והתקופה פעילים בממשק; לצורך ההדמיה ערכי המדדים קבועים. במערכת האמיתית כולם יחושבו מהנתונים המסוננים.</p>`}
function productsView(){const brandCounts=Object.entries(products.reduce((o,p)=>(o[p.brand]=(o[p.brand]||0)+p.calls,o),{})).sort((a,b)=>b[1]-a[1]);const suppCounts=Object.entries(products.reduce((o,p)=>(o[p.supplier]=(o[p.supplier]||0)+p.calls,o),{})).sort((a,b)=>b[1]-a[1]);return `<div class="sectionHead" style="margin-top:0"><div><h2>ניתוח מוצרים וספקים</h2><div class="hint">נתונים מצטברים מאז תחילת השימוש במערכת · ללא מסנני תאריכים</div></div></div><section class="two sectionSpace"><div class="card"><h3>קריאות לפי ספק</h3>${suppCounts.map(([name,count],i)=>`<div class="barline" style="margin-top:12px;cursor:pointer" onclick="openDetail('supplier|${name}')"><span class="name">${name}</span><div class="track"><div class="fill gray" style="width:${count/suppCounts[0][1]*100}%"></div></div><span class="val">${count}</span></div>`).join('')}</div><div class="card"><h3>קריאות לפי מותג</h3>${brandCounts.map(([name,count])=>`<div class="barline" style="margin-top:12px;cursor:pointer" onclick="openDetail('brand|${name}')"><span class="name">${name}</span><div class="track"><div class="fill" style="width:${count/brandCounts[0][1]*100}%"></div></div><span class="val">${count}</span></div>`).join('')}</div></section><section class="section card"><div class="flexBetween"><div><h2>מק״טים עם הכי הרבה קריאות</h2><p class="hint">לחיצה על שורה פותחת קריאות לדוגמה · המשך טיפול נספר כחלק מאותה קריאה</p></div><span class="badged">${products.length} מק״טים</span></div><div class="tableWrap sectionSpace"><table><thead><tr><th>מק״ט</th><th>מוצר</th><th>מותג</th><th>ספק</th><th>קריאות</th><th>% אחריות</th><th>% המשך טיפול</th><th>תקלה נפוצה</th></tr></thead><tbody>${[...products].sort((a,b)=>b.calls-a.calls).map(p=>`<tr style="cursor:pointer" onclick="openDetail('sku|${p.sku}')"><td><button class="link">${p.sku}</button></td><td>${p.name}</td><td>${p.brand}</td><td>${p.supplier}</td><td class="number">${p.calls}</td><td>${p.warranty}%</td><td>${p.follow}%</td><td>${p.issue}</td></tr>`).join('')}</tbody></table></div></section>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));$('#view').innerHTML=state.tab==='general'?general():state.tab==='tech'?tech():productsView()}
function switchTab(tab){state.tab=tab;render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
function selectTech(id){state.tech=id;render()}function selectPeriod(id){state.techPeriod=id;state.techOffset=0;render()}function movePeriod(n){state.techOffset=Math.min(0,state.techOffset+n);render()}function setCustom(key,value){state[key]=value;render()}
function openDetail(id){const [kind,value]=id.split('|');let title='פירוט נתוני הדשבורד',desc='דוגמה לאופן שבו לחיצה על מדד תציג את הקריאות או הביקורים שמרכיבים אותו.';let records=calls;if(kind==='sku'){const p=products.find(p=>p.sku===value);title='קריאות למק״ט '+value+(p?' · '+p.name:'');records=calls.filter(c=>c.sku===value)}else if(kind==='supplier'){title='קריאות לפי ספק: '+value;records=calls.filter(c=>products.find(p=>p.sku===c.sku)?.supplier===value)}else if(kind==='brand'){title='קריאות לפי מותג: '+value;records=calls.filter(c=>products.find(p=>p.sku===c.sku)?.brand===value)}else if(id.startsWith('tech')){title='פירוט ביקורים — '+techs.find(t=>t.id===state.tech).name;records=calls.filter(c=>c.tech===techs.find(t=>t.id===state.tech).name)}else if(id==='closed'){title='קריאות שנסגרו';records=calls.filter(c=>c.status==='נסגרה')}else if(id==='opened'){title='קריאות שנפתחו';}else if(id==='missed'){title='ביקורים שלא בוצעו במועד';desc='בהדמיה זו אין נתוני קריאות אמיתיים לחישוב החריגות.';records=[]}else{title={'planned':'ביקורים מתוכננים היום','done':'ביקורים שבוצעו היום','pending':'ביקורים שטרם בוצעו','treat':'זמן טיפול ממוצע','drive':'זמן נסיעה ממוצע','first':'פתרון בביקור ראשון','close':'זמן ממוצע לסגירת קריאה'}[id]||title}$('#modalTitle').textContent=title;$('#modalDescription').textContent=desc;$('#modalBody').innerHTML=records.length?`<div class="tableWrap"><table><thead><tr><th>קריאה</th><th>לקוח</th><th>טכנאי</th><th>מק״ט</th><th>סטטוס</th><th>תאריך</th></tr></thead><tbody>${records.map(c=>`<tr><td>#${c.id}</td><td>${c.customer}</td><td>${c.tech}</td><td>${c.sku}</td><td>${c.status}</td><td>${c.date}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">אין רשומות בדוגמה המצומצמת הזו.</div>';$('#overlay').classList.add('open')}
function closeModal(){$('#overlay').classList.remove('open')}$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
