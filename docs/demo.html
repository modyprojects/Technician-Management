<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ניהול טכנאים · דמו חי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: demo bar on top; technician = phone frame + guide; office = right sidebar + work area. Single light look matching the mockups. */
:root{
  --ink:#18212B; --ink2:#263241; --ink3:#2C3846; --muted:#5E6A78; --soft:#8A9AAB;
  --line:#DDE3E9; --line2:#EEF1F4; --bg:#F2F4F6; --card:#FFFFFF; --tint:#F7F8FA;
  --accent:#155E75; --accent-d:#0E4457; --accent-l:#EAF3F6; --on-dark:#FFFFFF; --on-dark2:#AEB8C4; --on-dark3:#C9D1DA;
  --warn-bg:#FFF6E5; --warn-bd:#E8B44A; --warn-fg:#7A4B00; --warn-ink:#3D2600;
  --danger:#B42318; --danger-bg:#FDECEA; --danger-fg:#8A1C12;
  --s-new:#1F5FA8; --s-new-bg:#DCEBFA; --s-new-fg:#123B6B;
  --s-go:#C79A00; --s-go-bg:#FFF2CC; --s-go-fg:#5C4300;
  --s-work:#6A3FB5; --s-work-bg:#ECE3FA; --s-work-fg:#3D2370;
  --s-done:#2E7D32; --s-done-bg:#DDF3E2; --s-done-fg:#1B4D1F;
  --s-cont:#C2570C; --s-cont-bg:#FDE7D3; --s-cont-fg:#6B2E00;
  --s-cancel:#4A5563; --s-cancel-bg:#E4E7EB; --s-cancel-fg:#2C3540;
  --t-y:#2E7D32; --t-e:#C62828; --t-s:#1F5FA8;
  --display:'Rubik',system-ui,sans-serif; --body:'Assistant','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{display:flex;flex-direction:column}
#stagewrap{flex:1;min-height:0;display:flex;justify-content:center;overflow:hidden}
#stage{container-type:inline-size;container-name:stage;width:100%;height:100%;overflow:auto;background:var(--bg)}
body[data-device=tablet] #stagewrap,body[data-device=phone] #stagewrap{background:#C9D1DA;padding-block:14px}
body[data-device=tablet] #stage{width:min(820px,100%);border:10px solid #0F161E;border-radius:24px}
body[data-device=phone] #stage{width:min(390px,100%);border:10px solid #0F161E;border-radius:34px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;direction:rtl}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid #C9D1DA;border-radius:8px;padding:8px 10px}
textarea{resize:vertical}

/* demo bar */
.demobar{flex:none;background:#0F161E;color:var(--on-dark);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#0F161E}
.demobar .brand{font-family:var(--display);font-weight:600;font-size:15px;white-space:nowrap}
.demobar .brand small{font-family:var(--body);color:var(--on-dark2);font-weight:400;margin-inline-start:6px}
.roles{display:flex;background:#1C2632;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.roles button{border:0;background:transparent;color:var(--on-dark3);padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px}
.roles button.on{background:var(--card);color:var(--ink)}
.dbtn{border:1px solid #33414F;background:#1C2632;color:var(--on-dark);border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.dbtn:hover{background:#263241}
.dbtn .cnt{background:var(--s-cont);border-radius:999px;padding:0 6px;font-size:11px;margin-inline-start:4px}
.spacer{flex:1}

/* shared bits */
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.sub{font-size:13px;color:var(--muted)}
.btn{border:1px solid #C9D1DA;background:var(--card);border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-dark)}
.btn.pri:hover{background:var(--accent-d)}
.btn.dng{color:var(--danger);border-color:#E3A29B}
.btn:disabled{opacity:.45}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-weight:700;font-size:13px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-dark)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle}
.tog{width:40px;height:23px;border-radius:999px;background:#C9D1DA;border:0;position:relative;padding:0;flex:none}
.tog::after{content:"";position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:var(--card);transition:right .15s}
.tog.on{background:var(--accent)}
.tog.on::after{right:20px}
.tog:disabled{opacity:.6}
.scrollx{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-size:12px;color:var(--muted);font-weight:700;padding:9px 10px;background:var(--tint);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--tint)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--on-dark);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;max-width:min(560px,calc(100% - 32px));box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:center}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* technician */
.techwrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{width:390px;max-width:100%;height:min(800px,calc(100vh - 110px));min-height:560px;background:var(--bg);border:10px solid #0F161E;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(15,22,30,.25);flex:none}
.ph-status{height:30px;background:var(--ink);color:var(--on-dark);display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:700;flex:none}
.ph-head{background:var(--ink);color:var(--on-dark);padding:4px 16px 14px;flex:none}
.ph-head a,.ph-back{color:var(--on-dark3);font-size:14px;background:none;border:0;padding:4px 0}
.ph-main{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ph-foot{padding:12px 14px 16px;background:var(--card);border-top:1px solid var(--line);flex:none}
.ph-nav{height:62px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;flex:none}
.ph-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.ph-nav button.on{color:var(--accent)}
.bigbtn{width:100%;height:54px;border-radius:12px;border:0;font-weight:700;font-size:17px;color:var(--on-dark);display:flex;align-items:center;justify-content:center;gap:8px}
.bigbtn:disabled{background:#E4E7EB!important;color:var(--muted)!important}
.stat{flex:1;background:var(--ink2);border-radius:10px;padding:8px 10px}
.stat b{font-family:var(--display);font-size:20px;display:block}
.stat span{font-size:12px;color:var(--on-dark2)}
button.stat{border:1px solid #3A4A5B;color:var(--on-dark);text-align:right;display:block}
button.stat:hover{background:var(--ink3)}
.li{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:right}
.li:last-child{border-bottom:0}
.li .t{font-family:var(--display);font-weight:600;font-size:15px;width:46px;flex:none}
.act{height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;background:var(--card);border:1px solid #C9D1DA}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted);white-space:nowrap}
.media{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumb{aspect-ratio:1;max-width:100%;border-radius:10px;background:linear-gradient(135deg,#B9C6D2,#8A9AAB);position:relative;overflow:hidden;background-size:cover;background-position:center}
.thumb.vid::after{content:"▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--on-dark);font-size:18px}
.addm{aspect-ratio:1;max-width:100%;border:2px dashed #C9D1DA;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:700;flex-direction:column;gap:2px;background:none;position:relative}
.addm input{position:absolute;inset:0;opacity:0;cursor:pointer}
.seg{display:flex;background:#E4E7EB;border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;font-weight:700;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink)}
.res{height:84px;border-radius:14px;border:2px solid #C9D1DA;background:var(--card);font-size:18px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.res small{font-size:12px;font-weight:600;opacity:.8}
.reason{border-radius:10px;padding:10px 12px;font-weight:600;text-align:right;border:1px solid var(--line);background:var(--card);width:100%;font-size:14px}
.reason.on{border:2px solid var(--s-cont);background:var(--s-cont-bg);color:var(--s-cont-fg)}
.sig{width:100%;height:150px;border:1px solid #C9D1DA;border-radius:10px;background:var(--card);touch-action:none;display:block}
.guide{max-width:340px;display:flex;flex-direction:column;gap:12px;padding-top:8px}
.guide ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.55}

/* office */
.office{display:flex;min-height:100%}
.side{width:220px;flex:none;background:var(--ink);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.side .logo{font-family:var(--display);color:var(--on-dark);font-size:17px;padding:0 8px 14px}
.side .nav{display:flex;flex-direction:column;gap:2px}
.side .nav button{border:0;background:none;color:var(--on-dark3);text-align:right;padding:10px 12px;border-radius:8px;font-weight:600;font-size:15px}
.side .nav button.on{background:var(--ink2);color:var(--on-dark)}
.side .me{margin-top:auto;border-top:1px solid var(--ink3);padding:12px 6px 0;display:flex;gap:10px;align-items:center;color:var(--on-dark)}
.side .me .av{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.side .me small{display:block;color:var(--on-dark2);font-size:12px}
.work{flex:1;min-width:0;padding-block:22px;padding-inline:26px;display:flex;flex-direction:column;gap:16px}
.ptitle{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ptitle h1{font-size:24px}
.ptitle .sub{margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.15}
.kpi .d{font-size:12px;font-weight:700;margin-top:3px;color:var(--muted)}
.sec{padding:16px 18px;min-width:0}
.sec h2{font-size:16px;margin-bottom:12px}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.track{height:14px;background:var(--line2);border-radius:4px;overflow:hidden;display:flex}
.track span{display:block;height:100%}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calhead,.calbody{display:grid}
.calhead{border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.calhead>div{padding:10px 12px;border-right:1px solid var(--line2)}
.calcol{position:relative;border-right:1px solid var(--line2)}
.hr{position:absolute;right:0;left:0;border-top:1px solid var(--line2)}
.ev{position:absolute;right:5px;left:5px;border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.3;overflow:hidden;text-align:right;border:0;border-right:4px solid}
.ev b{font-size:13px;display:block}
.ev:hover{filter:brightness(.97);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.drawer-bg{position:fixed;inset:0;background:rgba(15,22,30,.4);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:min(440px,100%);height:100%;background:var(--card);display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer .db{padding:16px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.drawer .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.xbtn{border:0;background:var(--bg);border-radius:8px;width:36px;height:36px;font-size:17px;flex:none}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;font-size:14px}
.kv>span:nth-child(odd){color:var(--muted)}
.note{background:var(--accent-l);border:1px solid #B7D4DE;border-radius:10px;padding:10px 14px;font-size:13px;color:var(--accent-d);line-height:1.5}
.modal-bg{position:fixed;inset:0;background:rgba(15,22,30,.5);z-index:70;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-block:30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--card);border-radius:14px;width:min(860px,100%);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ol-top{background:#0F6CBD;color:var(--on-dark);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mailbox{display:grid;grid-template-columns:260px 1fr;min-height:420px}
.mailitem{display:block;width:100%;text-align:right;border:0;border-bottom:1px solid var(--line2);background:none;padding:10px 14px}
.mailitem.on{background:var(--accent-l)}
.vis{border-right:4px solid;padding:14px 16px}

@container stage (max-width:900px){
  .office{flex-direction:column}
  .side{width:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:8px 12px}
  .side .logo{padding:0 4px}
  .side .nav{flex-direction:row;flex-wrap:wrap}
  .side .nav button{padding:8px 10px;font-size:14px}
  .side .me{display:none}
  .work{padding-inline:16px;padding-block:16px}
  .cols2,.cols3{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:110px 1fr 40px}
  .mailbox{grid-template-columns:minmax(0,1fr)}
  /* technician: real app, no phone mockup */
  .guide{display:none}
  .techwrap{padding:0;height:100%;display:block}
  .phone{width:100%;max-width:none;height:100%;min-height:0;border:0;border-radius:0;box-shadow:none}
  .ph-status{display:none}
  .ph-head{padding-top:max(12px,env(safe-area-inset-top,0px))}
  .ph-nav{height:auto;padding-block:8px max(8px,env(safe-area-inset-bottom,0px))}
}
@container stage (min-width:600px) and (max-width:900px){
  /* tablet: wider technician layout, bigger touch targets */
  .ph-main{padding:18px 24px;gap:14px}
  .ph-main>*{width:100%;max-width:760px;margin-inline:auto}
  .ph-head,.ph-foot{padding-inline:24px}
  .ph-head h1{font-size:26px!important}
  .li{padding-block:14px}
  .bigbtn{height:60px;font-size:19px;max-width:760px;margin-inline:auto}
  .act{height:62px;font-size:14px}
  .media{grid-template-columns:repeat(6,1fr)}
}
@container stage (max-width:520px){
  td,th{white-space:nowrap;padding:9px 8px}
  .scrollx{-webkit-overflow-scrolling:touch}
  .ptitle h1{font-size:21px}
  .kpi .v{font-size:24px}
  .tabs button{padding:8px 10px;font-size:14px}
  .bar{grid-template-columns:90px 1fr 34px;font-size:13px}
}
@media (max-width:700px){
  .demobar{gap:6px 8px;padding-block:6px}
  .demobar .brand small{display:none}
  .roles button{padding:5px 8px;font-size:12px}
  .dbtn{padding:5px 8px;font-size:12px}
  #devices{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="demobar">
  <span class="brand">ניהול טכנאים <small>דמו חי · גרסה 2 · נתונים בדויים</small></span>

  <div class="roles" id="devices" aria-label="תצוגה לפי מכשיר"></div>

  <button class="dbtn" data-act="reset">איפוס</button>
</div>

<script>
// ===== helpers =====
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const D = s => new Date(s + 'T12:00:00');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (s, n) => { const d = D(s); d.setDate(d.getDate() + n); return iso(d); };
const ddmm = s => s.slice(8) + '.' + s.slice(5, 7);
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DAYS_S = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const dayName = s => DAYS[D(s).getDay()];
const isWork = s => D(s).getDay() <= 4;
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const TODAY = '2026-10-21';
const rnd = (seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(20261021);

  phone: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  wa: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l1.5-4A8 8 0 1 1 8 18.5z"/></svg>',
  user: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  home: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9H3z"/></svg>',
  cal: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  cam: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  vid: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>',
  mic: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>'
};
const myVisits = date => allVisits().filter(x => x.v.tech === ME && x.v.date === date && x.v.status !== 'cancel').sort((a, b) => toMin(a.v.start) - toMin(b.v.start));
const selVisit = () => { if (!S.techSel) return null; const c = findCall(S.techSel.req); return { c, v: c.visits.find(v => v.n === S.techSel.n) }; };

function backBtn() { return '<button class="ph-back" data-act="back">› חזרה</button>'; }
function phone(head, main, foot, nav) {
  if ((S.techView === 'cal' || S.techView === 'prof') && !head.includes('data-act="back"')) head = '<button class="ph-back" data-act="back" style="display:block">› חזרה</button>' + head;
  return `<div class="techwrap"><div class="phone">
    <div class="ph-status num"><span>${nowHM()}</span><span>●●● 5G</span></div>
    <div class="ph-head">${head}</div>
    <div class="ph-main" id="phmain">${main}</div>
    ${foot ? `<div class="ph-foot">${foot}</div>` : ''}
    ${nav ? techNav() : ''}
  </div>${guide()}</div>`;
}
function techNav() {
  const t = [['home', 'היום', IC.home], ['cal', 'יומן', IC.cal], ['prof', 'פרופיל', IC.user]];
  return `<div class="ph-nav">${t.map(([k, l, i]) => `<button class="${S.techView === k ? 'on' : ''}" data-act="techTab" data-v="${k}" data-track="טכנאי · לשונית ${l}">${i}${l}</button>`).join('')}</div>`;
}
function guide() {
  return `<aside class="guide">
    <h2 style="font-size:18px">מה לנסות כאן</h2>
    <ol>
      <li>לחץ על <b>משפחת לוי</b> ברשימה של היום.</li>
      <li>לחץ <b>Waze</b>: הסטטוס הופך ל"בדרך". שעת היציאה נרשמת ברקע, והטכנאי לא רואה אותה.</li>
      <li>לחץ <b>הגעתי</b>, הוסף <b>תמונה אחרי הטיפול</b> (חובה) ו<b>סיכום</b> בכתיבה או בהקלטה.</li>
      <li>ב<b>סיום ביקור</b> בחר "טופל" וחתום, או "המשך טיפול" ובחר סיבה.</li>
      <li>פתח <b>✉ מיילים שנשלחו</b> למעלה, ואז עבור ל<b>שירות לקוחות</b> או ל<b>מנהל</b> כדי לראות את העדכון ביומן, בכרטיס ובדשבורד.</li>
      <li>אבי כהן הוא <b>ביקור המשך</b>: הכרטיס מראה מה נעשה בביקור הקודם.</li>
    </ol>
    <div class="note">שעות היציאה, ההגעה והסיום נרשמות ברקע ומוצגות רק במשרד, לא לטכנאי.</div>
  </aside>`;
}

function techHome() {
  const vs = myVisits(TODAY);
  const open = vs.filter(x => OPEN.includes(x.v.status));
  const closed = vs.filter(x => !OPEN.includes(x.v.status));
  const next = open.find(x => x.v.status === 'work') || open.find(x => x.v.status === 'go') || open[0];
  const head = `<div class="sub" style="color:var(--on-dark2)">יום ${dayName(TODAY)} · ${ddmm(TODAY)}.2026</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:2px"><h1 style="font-size:22px">בוקר טוב, יורם</h1><span style="display:flex;gap:8px;align-items:center"><span style="width:36px;height:36px;border-radius:50%;background:var(--t-y);display:flex;align-items:center;justify-content:center;font-weight:700">י</span>${bellBtn()}</span></div>
    <div style="display:flex;gap:8px;margin-top:12px"><div class="stat"><b class="num">${open.length}</b><span>ביקורים היום</span></div><button class="stat" data-act="techGo" data-v="doneList" data-track="טכנאי · הושלמו"><b class="num">${closed.length}</b><span>הושלמו ›</span></button></div>`;
  let main = '';
  if (next) {
    const { c, v } = next;
    main += `<div class="card" style="padding:14px;border:2px solid var(--accent)">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:700;color:var(--accent)">${v.status === 'new' ? 'הביקור הבא' : 'עכשיו'} · ${v.start}–${v.end}</span>${pill(v.status)}</div>
      <div style="font-family:var(--display);font-weight:600;font-size:18px;margin-top:6px">${esc(c.customer)}${v.n > 1 ? ' <span class="pill" style="background:var(--s-cont-bg);color:var(--s-cont-fg)">↻ ביקור המשך</span>' : ''}</div>
      <div class="sub">${esc(c.street)}, ${esc(c.city)} · ${esc(prod(c.sku).name)}</div>
      <div style="display:flex;gap:8px;margin-top:12px">
        ${v.status === 'new' ? `<button class="bigbtn" style="height:44px;font-size:15px;background:var(--accent)" data-act="waze" data-req="${c.req}" data-n="${v.n}" data-track="טכנאי · ניווט ב-Waze">${IC.pin} יוצא · Waze</button>` : ''}
        <button class="btn" style="flex:1;height:44px" data-act="openVisit" data-req="${c.req}" data-n="${v.n}" data-track="טכנאי · פתיחת כרטיס קריאה">פרטי קריאה</button>
      </div></div>`;
  }
  const coll = open.filter(x => x.v.collect);
  if (coll.length) {
    const groups = {};
    coll.forEach(x => (groups[x.v.collectFrom || 'לא צוין'] ||= []).push(x));
    const doneN = coll.filter(x => S.collected[x.c.req + '-' + x.v.n]).length;
    main += `<section class="card" style="padding:10px 14px;background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-ink)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><b style="font-size:13px;color:var(--warn-fg)">מה לאסוף לפני יציאה</b><span style="font-size:12px;color:var(--warn-fg)">${doneN} מתוך ${coll.length} נאסף</span></div>
      ${Object.entries(groups).map(([pl, xs], i) => `<div style="${i ? 'border-top:1px solid #F0D9A8;padding-top:6px;margin-top:6px' : ''}">
        <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">${esc(pl)}</b><button style="border:0;background:none;font-size:12px;color:var(--accent);font-weight:700" data-act="wazePlace" data-p="${esc(pl)}" data-track="טכנאי · Waze למקום איסוף">Waze ›</button></div>
        ${xs.map(x => { const k = x.c.req + '-' + x.v.n; const on = !!S.collected[k]; return `<label style="display:flex;gap:8px;align-items:center;margin-top:4px;font-size:13px;${on ? 'text-decoration:line-through;color:#7A6A4F' : ''}"><input type="checkbox" data-in="collect" data-k="${k}" ${on ? 'checked' : ''} style="width:18px;height:18px;margin:0;padding:0"> ${esc(x.v.collect)} · ל${esc(x.c.customer.split(' ').slice(-1)[0])} ${x.v.start}</label>`; }).join('')}
      </div>`).join('')}
    </section>`;
  }
  main += `<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px"><b style="font-size:14px">לו"ז היום</b><button class="chip" style="padding:3px 10px;font-size:12px" data-act="techTab" data-v="cal">יומן ›</button></div>
    ${open.length ? open.map(({ c, v }) => `<button class="li" data-act="openVisit" data-req="${c.req}" data-n="${v.n}" data-track="טכנאי · פתיחת כרטיס קריאה"><span class="t num">${v.start}</span><span style="flex:1;min-width:0"><b style="font-size:14px">${esc(c.customer)}</b><div class="sub">${esc(c.city)} · ${v.n > 1 ? '↻ ביקור המשך' : esc(prod(c.sku).name)}</div></span>${pill(v.status)}</button>`).join('') : '<div class="empty">אין עוד ביקורים היום</div>'}
    ${closed.length ? `<button data-act="techGo" data-v="doneList" style="display:block;width:100%;text-align:right;border:0;border-top:1px solid var(--line2);background:none;padding:8px 14px;font-size:12px;color:var(--muted)">הושלמו היום: ${closed.map(x => esc(x.c.customer)).join(', ')} <b style="color:var(--accent)">לפרטים ›</b></button>` : ''}
  </section>`;
  return phone(head, main, '', true);
}

function techCall() {
  const { c, v } = selVisit(); const p = prod(c.sku);
  const prev = c.visits.filter(x => x.n < v.n && x.status !== 'cancel').slice(-1)[0];
  const head = `${backBtn('› היום', 'data-act="techTab" data-v="home"')}<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:4px"><div><div class="sub" style="color:var(--on-dark2)">פנייה ${c.req} · משימה ${v.task} · ביקור ${v.n}</div><h1 style="font-size:21px">${esc(c.customer)}</h1></div>${pill(v.status)}</div>`;
  let main = '';
  if (prev) main += `<section class="card" style="padding:10px 14px;border:2px solid var(--s-cont);background:#FFF8F2">
    <b style="font-size:13px;color:var(--s-cont-fg)">↻ ביקור המשך · היה כבר ביקור אצל הלקוח</b>
    <div style="font-size:13px;color:var(--ink2);margin-top:4px">ביקור ${prev.n} · ${ddmm(prev.date)} · ${tech(prev.tech).name} · <b style="color:var(--s-cont-fg)">${esc(prev.reason || ST[prev.status].l)}</b></div>
    ${prev.summary ? `<div style="font-size:14px;line-height:1.45;margin-top:4px">"${esc(prev.summary)}"</div>` : ''}
    <div style="font-size:12px;color:var(--muted);margin-top:4px">${prev.media.length} תמונות/סרטונים${prev.rec ? ` · הקלטה ${Math.floor(prev.rec / 60)}:${pad(prev.rec % 60)}` : ''}</div></section>`;
  main += `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
    <button class="act" style="background:var(--accent);color:var(--on-dark);border-color:var(--accent)" data-act="waze" data-req="${c.req}" data-n="${v.n}" data-track="טכנאי · ניווט ב-Waze">${IC.pin}Waze</button>
    <button class="act" data-act="dial" data-to="${esc(c.phone)}" data-who="ללקוח" data-track="טכנאי · חיוג ללקוח">${IC.phone}לקוח</button>
    <button class="act" data-act="dial" data-to="${esc(c.phone)}" data-who="וואטסאפ ללקוח" data-track="טכנאי · וואטסאפ ללקוח">${IC.wa}וואטסאפ</button>
    <button class="act" data-act="dial" data-to="03-000-9000" data-who="לנציגה ${esc(c.rep)}" data-track="טכנאי · חיוג לנציגה">${IC.user}נציגה</button></div>
  <section class="card" style="padding:4px 14px">
    <div class="row"><span class="k">כתובת</span><b>${esc(c.street)}, ${esc(c.city)}</b></div>
    <div class="row" style="display:grid;grid-template-columns:repeat(3,1fr)"><div><div class="k" style="font-size:12px">בניין</div><b>${esc(c.building || '—')}</b></div><div><div class="k" style="font-size:12px">קומה</div><b>${esc(c.floor || '—')}</b></div><div><div class="k" style="font-size:12px">דירה</div><b>${esc(c.apt || '—')}</b></div></div>
    ${c.arrival ? `<div class="row"><span class="k">הערות הגעה</span><span>${esc(c.arrival)}</span></div>` : ''}
    <div class="row"><span class="k">טלפון</span><span dir="ltr" class="num">${esc(c.phone)}</span></div>
    <div class="row"><span class="k">מוצר</span><span>${esc(p.name)}</span></div>
    <div class="row"><span class="k">מק"ט</span><span dir="ltr">${p.sku}</span></div>
    <div class="row"><span class="k">באחריות</span><span style="font-weight:700;color:${c.warranty.startsWith('כן') ? 'var(--s-done)' : 'var(--muted)'}">${esc(c.warranty)}</span></div>
    <div class="row"><span class="k">נציגה מטפלת</span><span>${esc(c.rep)}</span></div>
  </section>
  <section class="card" style="padding:10px 14px"><div class="sub" style="font-weight:700">תיאור התקלה</div><div style="font-size:15px;line-height:1.45">${esc(c.desc)}</div></section>
  ${v.collect ? `<section class="card" style="padding:10px 14px;background:var(--warn-bg);border-color:var(--warn-bd)"><div style="font-size:12px;color:var(--warn-fg);font-weight:700">לאסוף לפני הביקור</div><div style="display:flex;justify-content:space-between;gap:8px;color:var(--warn-ink);font-size:14px"><span>${esc(v.collect)} · <b>מ${esc(v.collectFrom)}</b></span><button style="border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;white-space:nowrap" data-act="wazePlace" data-p="${esc(v.collectFrom)}">Waze ›</button></div></section>` : ''}
  <div class="sub" style="display:flex;gap:6px;align-items:center">📅 נקלט אוטומטית מזימון Outlook</div>`;
  let foot;
  if (v.status === 'new' || v.status === 'go') foot = `<button class="bigbtn" style="background:var(--s-work)" data-act="arrived" data-track="טכנאי · הגעתי">הגעתי · התחלת טיפול</button><div class="sub" style="text-align:center;margin-top:6px">${v.status === 'new' ? 'אפשר ללחוץ Waze קודם כדי לסמן "בדרך"' : 'הסטטוס: בדרך ללקוח'}</div>`;
  else if (v.status === 'work') foot = `<button class="bigbtn" style="background:var(--s-work)" data-act="techGo" data-v="work">המשך לטיפול ›</button>`;
  else foot = `<div class="sub" style="text-align:center">הביקור נסגר · ${pill(v.status)}</div>`;
  return phone(head, main, foot, false);
}

function techWork() {
  const { c, v } = selVisit(); v.draft ||= { media: [], summary: '', rec: 0, mode: 'text' };
  const d = v.draft;
  const mediaBlock = (kind, label) => `<section class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:14px">${label}${kind === 'after' ? ' <span style="color:var(--danger)">*</span>' : ''}</b><span class="sub">${kind === 'after' ? 'חובה: לפחות תמונה או סרטון' : 'תמונות או סרטונים · לא חובה'}</span></div>
    <div class="media">${d.media.filter(m => m.when === kind).map(m => `<div class="thumb ${m.t === 'vid' ? 'vid' : ''}" ${m.url ? `style="background-image:url('${m.url}')"` : ''}></div>`).join('')}
      <label class="addm">${IC.cam}תמונה<input type="file" accept="image/*" data-in="media" data-when="${kind}" data-t="img" aria-label="הוספת תמונה"></label>
      <label class="addm">${IC.vid}סרטון<input type="file" accept="video/*" data-in="media" data-when="${kind}" data-t="vid" aria-label="הוספת סרטון"></label>
      <button class="addm" data-act="sampleMedia" data-when="${kind}">+ דוגמה</button></div></section>`;
  const head = `<div style="display:flex;justify-content:space-between;align-items:center">${backBtn('› פרטי קריאה', 'data-act="techGo" data-v="call"')}${pill(v.status)}</div><h1 style="font-size:19px;margin-top:6px">${esc(c.customer)} · ${esc(prod(c.sku).name)}</h1>`;
  const recLabel = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
  const main = mediaBlock('before', 'לפני הטיפול') + mediaBlock('after', 'אחרי הטיפול') + `
    <section class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:14px">סיכום הטיפול <span style="color:var(--danger)">*</span></b><span class="sub">חובה: כתיבה או הקלטה</span></div>
      <div class="seg" style="margin-bottom:10px"><button class="${d.mode === 'text' ? 'on' : ''}" data-act="sumMode" data-v="text">✎ כתיבה</button><button class="${d.mode === 'rec' ? 'on' : ''}" data-act="sumMode" data-v="rec">🎙 הקלטה</button></div>
      ${d.mode === 'text' ? `<textarea id="summary" data-in="summary" rows="5" style="width:100%" placeholder="מה נעשה בביקור?">${esc(d.summary)}</textarea>` :
      `<div style="display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:10px;padding:12px">
        <button data-act="${S.rec ? 'recStop' : 'recStart'}" aria-label="${S.rec ? 'עצירת הקלטה' : 'התחלת הקלטה'}" style="width:48px;height:48px;border-radius:50%;border:0;background:${S.rec ? 'var(--ink)' : 'var(--danger)'};color:var(--on-dark);flex:none">${S.rec ? '■' : IC.mic}</button>
        <div style="flex:1"><b id="recTime" class="num">${S.rec ? '0:00' : d.rec ? recLabel(d.rec) : 'אין הקלטה'}</b><div class="sub">${S.rec ? 'מקליט… (הדמיה – המיקרופון לא מופעל בדמו)' : d.rec ? 'ההקלטה נשמרה. לחץ שוב כדי להקליט מחדש.' : 'לחץ כדי להתחיל להקליט'}</div></div></div>`}
      ${d.mode === 'text' && d.rec ? `<div class="sub" style="margin-top:6px">יש גם הקלטה של ${recLabel(d.rec)}</div>` : ''}
    </section>`;
  const hasAfter = d.media.some(m => m.when === 'after');
  const ok = (d.summary.trim() || d.rec) && hasAfter;
  const foot = `<button class="bigbtn" id="finishBtn" style="background:var(--ink)" data-act="techGo" data-v="close" ${ok ? '' : 'disabled'}>סיום ביקור ›</button><div class="sub" id="finishHint" style="text-align:center;margin-top:6px">${workHint(d)}</div>`;
  return phone(head, main, foot, false);
}

function workReady(d) { return !!((d.summary.trim() || d.rec) && d.media.some(m => m.when === 'after')); }
function workHint(d) { const sum = d.summary.trim() || d.rec, aft = d.media.some(m => m.when === 'after'); return sum && aft ? 'אפשר לסיים את הביקור' : !sum && !aft ? 'חסרים: תמונה אחרי הטיפול וסיכום' : !aft ? 'חסרה תמונה או סרטון אחרי הטיפול' : 'חסר סיכום כתוב או הקלטה'; }
function techClose() {
  const { c, v } = selVisit(); const k = S.close;
  const head = `${backBtn('› חזרה לטיפול', 'data-act="techGo" data-v="work"')}<h1 style="font-size:19px;margin-top:6px">סיום ביקור · ${esc(c.customer)}</h1>`;
  let main = `<b style="font-size:14px">מה התוצאה של הביקור? <span style="color:var(--danger)">*</span></b>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="res" data-act="closeChoice" data-v="done" style="${k.choice === 'done' ? 'border-color:var(--s-done);background:var(--s-done-bg);color:var(--s-done-fg)' : ''}">✓ טופל<small>הקריאה תיסגר</small></button>

// signature pad
function initSig() {
  const cv = document.getElementById('sig'); if (!cv) return;
  const r = cv.getBoundingClientRect(); cv.width = r.width * 2; cv.height = r.height * 2;
  const g = cv.getContext('2d'); g.scale(2, 2); g.lineWidth = 2.4; g.lineCap = 'round'; g.strokeStyle = '#18212B';
  if (S.close.sig) { const im = new Image(); im.onload = () => g.drawImage(im, 0, 0, r.width, r.height); im.src = S.close.sig; }
  let draw = false;
  const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { draw = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); g.beginPath(); g.moveTo(x, y); };
  cv.onpointermove = e => { if (!draw) return; const [x, y] = pos(e); g.lineTo(x, y); g.stroke(); };
  cv.onpointerup = () => { if (!draw) return; draw = false; S.close.ink = true; S.close.sig = cv.toDataURL(); updateSend(); };
}
function updateSend() {
  const b = document.getElementById('sendBtn'); if (!b) return;
  const k = S.close; const ok = k.choice === 'done' ? (k.signer.trim() && k.ink) : k.choice === 'cont' ? !!k.reason : false;
  b.disabled = !ok;
}

function laneLayout(items) {
  const xs = items.map(x => ({ x, s: toMin(x.v.start), e: toMin(x.v.end) })).sort((a, b) => a.s - b.s);
  let cluster = [], end = -1; const out = [];
  const flush = () => { const lanes = []; cluster.forEach(it => { let i = lanes.findIndex(l => l <= it.s); if (i < 0) { i = lanes.length; lanes.push(0); } lanes[i] = it.e; it.lane = i; }); cluster.forEach(it => { it.n = lanes.length; out.push(it); }); cluster = []; };
  xs.forEach(it => { if (it.s >= end && cluster.length) flush(); cluster.push(it); end = Math.max(end, it.e); });
  if (cluster.length) flush();
  return out;
}
function offCal() {

  const evBtn = (c, v, style) => { const s = ST[v.status]; return `<button class="ev" data-act="drawer" data-req="${c.req}" data-n="${v.n}" data-track="${ROLE[S.role].short} · פתיחת ביקור ביומן" style="${style};background:${s.bg};color:${s.fg};border-right-color:${s.c}"`; };
  let body = '';
  if (mode === 'day') {

    body = `<div class="scrollx"><div class="cal" style="min-width:${techs.length > 1 ? 640 : 320}px">
      <div class="calhead" style="grid-template-columns:${grid}"><div></div>${techs.map(t => `<div><span class="dot" style="background:${t.color}"></span> ${t.name} <span class="sub" style="font-weight:400">· ${day.filter(x => x.v.tech === t.id).length} ביקורים</span></div>`).join('')}</div>

          ${laneLayout(day.filter(x => x.v.tech === t.id)).map(({ x: { c, v }, lane, n }) => { const top = (toMin(v.start) - 480) / 60 * H; const h = Math.max(36, (toMin(v.end) - toMin(v.start)) / 60 * H - 4); const w = 100 / n; return evBtn(c, v, `top:${top + 2}px;height:${h}px;right:calc(${lane * w}% + 4px);left:auto;width:calc(${w}% - 8px)`) + `><b>${esc(c.customer)}</b>${v.start} · ${esc(c.city)}${v.n > 1 ? ' · ביקור ' + v.n : ''}<br>${ST[v.status].l}</button>`; }).join('')}

  // demo bar
  outlookOpen: () => { OL = sampleInvite('new'); S.overlay = 'outlook'; render(); },
  olSample: e => { OL = sampleInvite(e.dataset.v); render(); },
  olSend: () => parseInvite(),
  mailsOpen: e => { S.overlay = 'mails'; S.mailSel = e.dataset.id ? +e.dataset.id : (S.mails[0] || {}).id; render(); },
  mailSel: e => { S.mailSel = +e.dataset.id; render(); }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act],[data-stop]'); if (!el || el.dataset.stop) return;
  if (el.disabled) return;
  if (el.dataset.track) S.track[el.dataset.track] = (S.track[el.dataset.track] || 0) + 1;
  const f = A[el.dataset.act]; if (f) f(el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target; const k = el.dataset && el.dataset.in; if (!k) return;
  if (k === 'q') { S.q = el.value; document.getElementById('callsBody').innerHTML = callsTable(); }
  else if (k === 'fTech') { S.fTech = el.value; document.getElementById('callsBody').innerHTML = callsTable(); }
  else if (k === 'summary') { const v = selVisit().v; v.draft.summary = el.value; const b = document.getElementById('finishBtn'); if (b) b.disabled = !workReady(v.draft); const h = document.getElementById('finishHint'); if (h) h.textContent = workHint(v.draft); }
  else if (k === 'signer') { S.close.signer = el.value; updateSend(); }
  else if (k === 'fixedText') { S.fixedText = el.value; }
  else if (k === 'ol') { OL[el.dataset.f] = el.value; }
});
document.addEventListener('change', ev => {
  const el = ev.target; const k = el.dataset && el.dataset.in;
  if (k === 'collect') { S.collected[el.dataset.k] = el.checked; if (el.checked) S.track['טכנאי · סימון "נאסף"'] = (S.track['טכנאי · סימון "נאסף"'] || 0) + 1; render(); }
  else if (k === 'media' && el.files && el.files[0]) { const v = selVisit().v; v.draft.media.push({ t: el.dataset.t, when: el.dataset.when, url: el.dataset.t === 'img' ? URL.createObjectURL(el.files[0]) : null }); render(); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'newReason') { A.addReason(); return; } if (ev.key === 'Escape' && S.overlay) { S.overlay = null; render(); } });

S = freshState();
render();
</script>

</body></html>
